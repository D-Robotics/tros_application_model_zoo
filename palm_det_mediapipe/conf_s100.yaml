# 模型参数组
model_parameters:
  onnx_model: './palm_detection_mediapipe_2023feb.onnx'
  march: 'nash-e'
  output_model_file_prefix: 'palm_det_192_192'
  working_dir: './model_output_s100'


# 输入信息参数组
input_parameters:
  input_name: ''
  input_shape: ''
  
  input_layout_train: 'NHWC'
  input_type_train: 'rgb'

  mean_value: '0.0'
  scale_value: '0.003921568627451'

  input_type_rt: 'nv12'
  

# 校准参数组
calibration_parameters:
  # 模型校准使用的标定样本的存放目录
  cal_data_dir: './calibration_data_bgr_s100/input_1'
  quant_config: 
    {
      "model_config":
      {
        'all_node_type': 'int16',
        # "model_output_type": "int16"
      }
    }
  
# 编译参数组
compiler_parameters:

  # 编译策略选择
  compile_mode: 'latency'

  # 模型运行核心数
  core_num: 1

  # 模型编译的优化等级选择
  optimize_level: 'O2'

  # 指定模型的每个function call的最大可连续执行时间
  max_time_per_fc: 1000

  # 指定编译模型时的进程数
  jobs: 8